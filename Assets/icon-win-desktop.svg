<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 底板渐变：靛紫 -->
    <linearGradient id="baseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="baseHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 钢笔笔杆渐变 -->
    <linearGradient id="penBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.5" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <!-- 笔尖金属渐变 -->
    <linearGradient id="penNib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.6" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#312E81" flood-opacity="0.2"/>
    </filter>
    <filter id="penShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#1E1B4B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 圆角方形底板 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#baseGrad)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#baseHi)"/>

  <!-- 稿纸 -->
  <g filter="url(#paperShadow)">
    <rect x="50" y="50" width="140" height="160" rx="12" fill="#FFF8F0"/>
    <!-- 标题行 -->
    <rect x="64" y="66" width="72" height="9" rx="4.5" fill="#64748B"/>
    <!-- 横线 -->
    <line x1="64" y1="92" x2="176" y2="92" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="64" y1="110" x2="176" y2="110" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="64" y1="128" x2="176" y2="128" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="64" y1="146" x2="160" y2="146" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="64" y1="164" x2="176" y2="164" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    <line x1="64" y1="182" x2="140" y2="182" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 钢笔（笔尖在左上触纸处，笔杆向右下斜伸） -->
  <g transform="translate(96 90) rotate(32)" filter="url(#penShadow)">
    <!-- 墨水点 -->
    <circle cx="0" cy="0" r="3.5" fill="#1E1B4B"/>
    <!-- 笔尖三角 -->
    <path d="M 0 0 L 16 -8 L 16 8 Z" fill="url(#penNib)"/>
    <!-- 笔尖通气缝 -->
    <line x1="0" y1="0" x2="14" y2="0" stroke="#475569" stroke-width="0.8"/>
    <!-- 笔尖环 -->
    <rect x="14" y="-9" width="10" height="18" rx="2" fill="#334155"/>
    <!-- 笔杆 -->
    <rect x="22" y="-6" width="90" height="12" rx="3" fill="url(#penBody)"/>
    <!-- 笔杆高光 -->
    <rect x="24" y="-5" width="86" height="3" rx="1.5" fill="#FFFFFF" opacity="0.12"/>
    <!-- 笔帽 -->
    <rect x="108" y="-7" width="12" height="14" rx="4" fill="#1E293B"/>
    <!-- 笔尾装饰 -->
    <circle cx="120" cy="0" r="3" fill="#6366F1"/>
  </g>
</svg>
